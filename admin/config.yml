backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "page_accueil"
    label: "Page d'accueil"
    files:
      - file: "index.html"
        label: "Accueil"
        name: "accueil"
        fields:
          - { label: "Titre", name: "titre", widget: "string" }
          - { label: "Texte", name: "texte", widget: "text" }

