backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:

  # 🎉 Événements
  - name: "evenements"
    label: "Événements"
    folder: "evenements"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Image", name: "image", widget: "image" }

  # 🍸 Carte du bar
  - name: "menu"
    label: "Carte du Bar"
    folder: "menu"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre de la section", name: "title", widget: "string" }
      - label: "Cocktails"
        name: "items"
        widget: "list"
        fields:
          - { label: "Nom", name: "name", widget: "string" }
          - { label: "Prix", name: "price", widget: "string" }
          - { label: "Ingrédients", name: "ingredients", widget: "text" }

  # 🏠 Page d'accueil
  - name: "accueil"
    label: "Page d'accueil"
    file: "content/accueil.md"
    fields:
      - { label: "Titre principal", name: "titre", widget: "string" }
      - { label: "Texte de présentation", name: "texte", widget: "text" }
      - { label: "Image de fond (Hero)", name: "hero", widget: "image" }

  # 📞 Contact
  - name: "contact"
    label: "Page Contact"
    file: "content/contact.md"
    fields:
      - { label: "Adresse", name: "adresse", widget: "string" }
      - { label: "Téléphone", name: "tel", widget: "string" }
      - { label: "Email", name: "email", widget: "string" }
      - label: "Horaires"
        name: "horaires"
        widget: "list"
        fields:
          - { label: "Jour", name: "jour", widget: "string" }
          - { label: "Heures", name: "heures", widget: "string" }
